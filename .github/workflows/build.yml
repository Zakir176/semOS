name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc libgtk-3-dev

    - name: Compile C source files
      run: |
        mkdir -p bin
        gcc -Wall -Wextra -g -o bin/semOS \
          src/*.c \
          -Iinclude \
          $(pkg-config --cflags --libs gtk+-3.0) \
          -lm

    - name: Check for compilation warnings
      run: |
        echo "Build completed successfully!"
        ls -la bin/semOS

    - name: Display build artifacts
      run: file bin/semOS && echo "Binary size:" && du -h bin/semOS
