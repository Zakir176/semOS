name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev

      - name: Build full binary
        run: make all

      - name: Build CLI-only binary
        run: make cli

      - name: Run smoke test for CLI binary
        run: printf "0\n" | timeout 2 ./bin/serc-os-cli || true

      - name: Verify build artifacts
        run: |
          ls -la bin
          file bin/serc-os
          file bin/serc-os-cli
          echo "Binary sizes:"
          du -h bin/serc-os bin/serc-os-cli